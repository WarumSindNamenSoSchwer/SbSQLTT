<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Tabula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f8fafc;--surface:#fff;--subtle:#f1f5f9;--line:#e2e8f0;--line-strong:#cbd5e1;--ink:#0f172a;--ink-2:#475569;--ink-3:#64748b;--accent:#2563eb;--accent-soft:#eff6ff;--accent-line:#bfdbfe;--accent-ink:#1d4ed8;--warn-soft:#fffbeb;--warn-ink:#92400e}
:root[data-tb="dark"]{color-scheme:dark;--bg:#0b1220;--surface:#111a2e;--subtle:#1e293b;--line:#334155;--line-strong:#475569;--ink:#e2e8f0;--ink-2:#94a3b8;--ink-3:#94a3b8;--accent-soft:#172554;--accent-line:#1e3a8a;--accent-ink:#93c5fd;--warn-soft:#3b2a0a;--warn-ink:#fcd34d}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
::selection{background:var(--accent-line);color:var(--ink)}
a{color:var(--accent-ink);text-underline-offset:3px}a:hover{color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes tbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div ref="{{ rootRef }}" style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg)">
  <header style="position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)">
    <div style="max-width:1680px;margin:0 auto;padding:0 clamp(16px,3vw,48px);min-height:60px;display:flex;align-items:center;gap:28px;flex-wrap:wrap">
      <a href="Tabula Landing.dc.html" style="display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:600;font-size:18px;letter-spacing:-.02em"><span data-owl-icon="1" style="width:28px;height:25px;display:block"></span>Tabula</a>
      <nav aria-label="Hauptnavigation" style="display:flex;gap:4px;flex:1;font-size:14px">
        <a href="Tabula Lernen.dc.html" style="padding:6px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none" style-hover="background:var(--subtle);color:var(--ink)">Lernen</a>
        <a href="Tabula Datensätze.dc.html" style="padding:6px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none" style-hover="background:var(--subtle);color:var(--ink)">Datensätze</a>
        <a href="Tabula Landing.dc.html#lehrkraefte" style="padding:6px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none" style-hover="background:var(--subtle);color:var(--ink)">Für Lehrkräfte</a>
      </nav>
      <button type="button" onClick="{{ toggleTheme }}" aria-label="Hell/Dunkel umschalten" style="width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;color:var(--ink-2)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"></circle><path d="M8 2.5v11A5.5 5.5 0 0 0 8 2.5Z" fill="currentColor"></path></svg>
      </button>
    </div>
  </header>

  <sc-if value="{{ isState }}" hint-placeholder-val="{{ true }}">
    <main style="flex:1;display:grid;place-items:center;padding:48px 20px">
      <div style="max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;animation:tbIn .3s ease-out">
        <span data-owl="{{ owl }}" style="width:180px;height:162px"></span>
        <p style="margin:0;font:500 13px 'IBM Plex Mono',monospace;color:var(--ink-3)">{{ code }}</p>
        <h1 style="margin:0;font-size:clamp(30px,3vw,42px);font-weight:600;letter-spacing:-.025em">{{ title }}</h1>
        <p style="margin:0;font-size:16px;line-height:1.6;color:var(--ink-2);text-wrap:pretty">{{ text }}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px">
          <sc-for list="{{ actions }}" as="a" hint-placeholder-count="2">
            <a href="{{ a.href }}" onClick="{{ a.click }}" style="display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:8px;border:1px solid {{ a.border }};background:{{ a.bg }};color:{{ a.ink }};text-decoration:none;font-size:15px;font-weight:600">{{ a.label }}</a>
          </sc-for>
        </div>
      </div>
    </main>
  </sc-if>

  <sc-if value="{{ isText }}" hint-placeholder-val="{{ false }}">
    <main style="flex:1;max-width:1180px;width:100%;margin:0 auto;padding:40px clamp(16px,3vw,48px) 96px;display:flex;gap:48px;flex-wrap:wrap;align-items:flex-start">
      <nav aria-label="Inhalt" style="flex:0 1 240px;position:sticky;top:84px;display:flex;flex-direction:column;gap:2px;font-size:14px">
        <p style="margin:0 0 8px;font-size:13px;color:var(--ink-3)">Inhalt</p>
        <sc-for list="{{ toc }}" as="t" hint-placeholder-count="5"><a href="#{{ t.id }}" style="padding:6px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none" style-hover="background:var(--subtle);color:var(--ink)">{{ t.h }}</a></sc-for>
      </nav>
      <article style="flex:1 1 560px;min-width:0;max-width:72ch">
        <h1 style="margin:0 0 8px;font-size:clamp(30px,3vw,42px);font-weight:600;letter-spacing:-.025em">{{ docTitle }}</h1>
        <p style="margin:0 0 32px;font-size:14px;color:var(--ink-3)">{{ docMeta }}</p>
        <sc-for list="{{ sections }}" as="s" hint-placeholder-count="5">
          <section id="{{ s.id }}" style="padding-top:8px;margin-bottom:28px;scroll-margin-top:84px">
            <h2 style="margin:0 0 10px;font-size:20px;font-weight:600;letter-spacing:-.01em">{{ s.h }}</h2>
            <sc-for list="{{ s.ps }}" as="p" hint-placeholder-count="2"><p style="margin:0 0 12px;font-size:16px;line-height:1.7;color:var(--ink-2);text-wrap:pretty">{{ p }}</p></sc-for>
          </section>
        </sc-for>
      </article>
    </main>
  </sc-if>

  <footer style="border-top:1px solid var(--line);padding:20px clamp(16px,3vw,48px);display:flex;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--ink-3)">
    <span style="margin-right:auto">Kostenlos und Open Source unter AGPL-3.0.</span>
    <a href="#" onClick="{{ goImp }}" style="color:var(--ink-3)">Impressum</a><a href="#" onClick="{{ goDs }}" style="color:var(--ink-3)">Datenschutzerklärung</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;404&quot;,&quot;500&quot;,&quot;offline&quot;,&quot;datenschutz&quot;,&quot;impressum&quot;],&quot;default&quot;:&quot;404&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Bildschirm&quot;}}">
const DS = [
  ['ueberblick', 'Auf einen Blick', ['Tabula speichert nur, was für den Unterricht nötig ist. Es gibt keine Werbung, kein Tracking und keine Analyse-Tools. Inhalte, Schriften und Skripte kommen nur von unserem eigenen Server.', 'Zum Ausprobieren braucht es keine Anmeldung. Der Fortschritt wird dann nur in deinem Browser gespeichert.']],
  ['schueler', 'Schüler', ['Schüler haben kein Konto. Sie treten mit dem Klassencode bei und wählen selbst Name und Passwort. Name und Passwort verlassen das Gerät nicht im Klartext.', 'Der Server speichert eine Nummer, einen Prüfwert, den Namen in verschlüsselter Form und den Lernfortschritt. Den Namen kann nur der Browser der Lehrkraft dieser Klasse entschlüsseln. Eine E-Mail-Adresse oder einen Benutzernamen gibt es nicht.', 'Schüler können ihre Klasse jederzeit verlassen.']],
  ['lehrkraefte', 'Lehrkräfte', ['Für das Lehrer-Konto speichern wir Name, E-Mail-Adresse, das Passwort nur als Argon2id-Hash und optional die Schule.', 'Lehrkräfte können ihr Konto jederzeit löschen. Dabei werden auch ihre Klassen und der Lernfortschritt der Schüler gelöscht.']],
  ['sql', 'SQL-Abfragen', ['Alle Abfragen laufen vollständig im Browser. Sie werden nicht an uns gesendet.']],
  ['server', 'Server und Cookies', ['Tabula läuft auf Servern von Hetzner im Rechenzentrum Nürnberg, Deutschland. Mit Hetzner besteht ein Vertrag zur Auftragsverarbeitung.', 'Es gibt genau ein Cookie: tabula_session. Es wird erst nach dem Anmelden gesetzt und hält die Sitzung. Ohne Anmeldung setzen wir kein Cookie.']],
  ['offen', 'Offen und prüfbar', ['Der gesamte Quellcode liegt auf GitHub. Jede Aussage auf dieser Seite lässt sich dort nachprüfen.']]
];
const IMP = [
  ['anbieter', 'Anbieter', ['[Name und ladungsfähige Anschrift des Verantwortlichen ergänzen]']],
  ['kontakt', 'Kontakt', ['E-Mail: kontakt@tabulasql.de', 'Für Fragen und Demo-Anfragen nutzen Sie gern die Kontaktseite.']],
  ['quellcode', 'Quellcode', ['Tabula ist Open Source unter der Lizenz AGPL-3.0.']]
];
class Component extends DCLogic {
  state = { theme: 'light', screen: null };
  rootRef = React.createRef();
  async componentDidMount() {
    this.C = await import(new URL('tabula-core.js', document.baseURI).href);
    const theme = this.C.getTheme('light'); document.documentElement.dataset.tb = theme;
    this.setState({ theme });
    await this.C.loadOwl();
    const G = (await import(new URL('owl-gen.js', document.baseURI).href)).default;
    this.icons = { light: G.icon({}), dark: G.icon(G.DARK) };
    this.paint();
  }
  componentDidUpdate(pp) { if (pp && pp.screen !== this.props.screen) this.setState({ screen: null }); this.paint(); }
  paint() {
    const root = this.rootRef.current; if (!this.C || !root) return;
    const dark = this.state.theme === 'dark';
    this.C.paintOwls(root, dark);
    if (this.icons) root.querySelectorAll('[data-owl-icon]').forEach(el => { const k = dark ? 'dark' : 'light'; if (el.dataset.k !== k) { el.innerHTML = this.icons[k].replace('<svg ', '<svg style="width:100%;height:100%;display:block" aria-hidden="true" '); el.dataset.k = k; } });
  }
  renderVals() {
    const S = this.state, scr = S.screen || this.props.screen || '404';
    const btn = (label, href, primary, click) => ({ label, href, click: click || null, bg: primary ? 'var(--accent)' : 'var(--surface)', ink: primary ? '#fff' : 'var(--ink)', border: primary ? 'var(--accent)' : 'var(--line)' });
    const reload = e => { e.preventDefault(); location.reload(); };
    const M = {
      '404': ['surprised', 'Fehler 404', 'Seite nicht gefunden', 'Diese Seite gibt es nicht oder nicht mehr. Vielleicht hat sich ein Tippfehler in die Adresse geschlichen.', [btn('Zur Startseite', 'Tabula Landing.dc.html', true), btn('Zu den Lektionen', 'Tabula Lernen.dc.html')]],
      '500': ['error', 'Fehler 500', 'Da ist etwas schiefgelaufen', 'Das liegt nicht an dir. Lade die Seite neu. Wenn der Fehler bleibt, versuche es in ein paar Minuten noch einmal.', [btn('Neu laden', '#', true, reload), btn('Zur Startseite', 'Tabula Landing.dc.html')]],
      offline: ['sleep', 'Keine Verbindung', 'Du bist offline', 'Prüfe die Internetverbindung. Sobald sie wieder steht, geht es an derselben Stelle weiter.', [btn('Erneut versuchen', '#', true, reload)]]
    }[scr];
    const isText = scr === 'datenschutz' || scr === 'impressum', doc = scr === 'impressum' ? IMP : DS;
    return {
      rootRef: this.rootRef,
      toggleTheme: () => { const th = S.theme === 'dark' ? 'light' : 'dark'; this.C.setTheme(th); this.setState({ theme: th }); },
      isState: !isText, isText,
      owl: M ? M[0] : 'idle', code: M ? M[1] : '', title: M ? M[2] : '', text: M ? M[3] : '', actions: M ? M[4] : [],
      docTitle: scr === 'impressum' ? 'Impressum' : 'Datenschutzerklärung', docMeta: scr === 'impressum' ? 'Angaben gemäß § 5 DDG' : 'Stand: Oktober 2026',
      toc: doc.map(s => ({ id: s[0], h: s[1] })), sections: doc.map(s => ({ id: s[0], h: s[1], ps: s[2] })),
      goImp: e => { e.preventDefault(); this.setState({ screen: 'impressum' }); scrollTo(0, 0); }, goDs: e => { e.preventDefault(); this.setState({ screen: 'datenschutz' }); scrollTo(0, 0); }
    };
  }
}
</script>
</body>
</html>
