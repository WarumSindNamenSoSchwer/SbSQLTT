<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Tabula · SQL im Informatikunterricht</title>
		<meta
			name="description"
			content="Tabula ist ein kostenloser, quelloffener SQL-Trainer für den Informatikunterricht. Schüler schreiben Abfragen an echte Daten direkt im Browser, Lehrkräfte sehen den Lernstand ihrer Klasse."
		/>
		<meta name="theme-color" content="#3B82F6" />
		<link rel="canonical" href="https://www.tabulasql.de/" />
		<link rel="icon" type="image/svg+xml" href="/edgar/owl-icon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Tabula" />
		<meta property="og:title" content="Tabula · SQL lernen. Einfach ausprobieren." />
		<meta property="og:description" content="Kostenloser, quelloffener SQL-Trainer für den Informatikunterricht. Direkt im Browser, Server in Deutschland." />
		<meta property="og:locale" content="de_DE" />
		<meta property="og:url" content="https://www.tabulasql.de/" />
		<meta property="og:image" content="https://www.tabulasql.de/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Tabula: SQL lernen. Einfach ausprobieren. Mit Edgar, der Eule." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://www.tabulasql.de/og-image.png" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "Tabula",
				"url": "https://www.tabulasql.de/",
				"applicationCategory": "EducationalApplication",
				"operatingSystem": "Web",
				"inLanguage": "de-DE",
				"isAccessibleForFree": true,
				"license": "https://www.gnu.org/licenses/agpl-3.0.html",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
				"description": "SQL-Trainer für den Informatikunterricht ab Klasse 10. Abfragen laufen mit SQLite direkt im Browser.",
				"sameAs": ["https://github.com/WarumSindNamenSoSchwer/SbSQLTT"]
			}
		</script>
		<script>
			// App auf app.tabulasql.de, Website auf www (src/lib/tabula/host.ts). Läuft vor allem anderen.
			// www + App-Adresse (alte Links, QR-Codes, Anleitung): Fortschritt ohne Konto als URL-Fragment
			// mitnehmen (Fragmente gehen nie an einen Server), auf www löschen, weiterleiten.
			// app + Fragment: übernehmen (fertig gewinnt, sonst weiterer Schritt) und Fragment entfernen.
			(function () {
				var APP = /^\/(learn|teach|login|beitreten|profil|quiz|passwort-zuruecksetzen|email-bestaetigen)(\/|$)/;
				var TAG = '#tabula-uebernahme=';
				var KEYS = ['tabula-progress', 'tabula-theme', 'tabula-guest-hint'];
				var h = location.hostname;
				try {
					if (h === 'www.tabulasql.de' && APP.test(location.pathname)) {
						var d = {}, n = 0;
						KEYS.forEach(function (k) { var v = localStorage.getItem(k); if (v) { d[k] = v; n++; } });
						var to = 'https://app.tabulasql.de' + location.pathname + location.search;
						if (n) {
							if (location.hash) d['#'] = location.hash.slice(1);
							to += TAG + encodeURIComponent(JSON.stringify(d));
							localStorage.removeItem('tabula-progress');
							localStorage.removeItem('tabula-guest-hint');
						} else to += location.hash;
						location.replace(to);
						document.documentElement.style.visibility = 'hidden';
					} else if (h === 'app.tabulasql.de' && location.hash.indexOf(TAG) === 0) {
						var data = JSON.parse(decodeURIComponent(location.hash.slice(TAG.length)));
						var theirs = JSON.parse(data['tabula-progress'] || '{}');
						var mine = JSON.parse(localStorage.getItem('tabula-progress') || '{}');
						Object.keys(theirs).forEach(function (id) {
							var p = theirs[id], c = mine[id];
							if (!c || (!c.done && (p.done || (p.step || 0) > (c.step || 0)))) mine[id] = p;
						});
						if (Object.keys(mine).length) localStorage.setItem('tabula-progress', JSON.stringify(mine));
						if (data['tabula-theme'] && !localStorage.getItem('tabula-theme')) localStorage.setItem('tabula-theme', data['tabula-theme']);
						if (data['tabula-guest-hint']) localStorage.setItem('tabula-guest-hint', data['tabula-guest-hint']);
						history.replaceState(null, '', location.pathname + location.search + (data['#'] ? '#' + data['#'] : ''));
					} else if (h === 'app.tabulasql.de' && location.pathname === '/' && location.hash) {
						// "/#lehrkraefte" usw. sind Abschnitte der Startseite auf www
						location.replace('https://www.tabulasql.de/' + location.hash);
					}
				} catch (e) {
					if (h === 'app.tabulasql.de' && location.hash.indexOf(TAG) === 0) history.replaceState(null, '', location.pathname + location.search);
				}
			})();
		</script>
		<script>
			// Theme vor dem Rendern anwenden (kein Flash). Standard: hell.
			// Migration einmalig: alten Schlüssel 'sbsqltt-theme' auf 'tabula-theme' umziehen.
			try {
				const OLD = 'sbsqltt-theme';
				const NEW = 'tabula-theme';
				const old = localStorage.getItem(OLD);
				if (old !== null) {
					localStorage.setItem(NEW, old);
					localStorage.removeItem(OLD);
				}
				const saved = localStorage.getItem(NEW);
				if (saved === 'dark') {
					document.documentElement.classList.remove('light');
				} else {
					document.documentElement.classList.add('light');
				}
			} catch {
				document.documentElement.classList.add('light');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="font-sans antialiased text-ink-900">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
