<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Tabula · SQL im Informatikunterricht</title>
		<meta
			name="description"
			content="Tabula ist ein kostenloser, quelloffener SQL-Trainer für den Informatikunterricht. Schüler schreiben Abfragen an echte Daten direkt im Browser, Lehrkräfte sehen den Lernstand ihrer Klasse."
		/>
		<meta name="theme-color" content="#3B82F6" />
		<link rel="canonical" href="https://www.tabulasql.de/" />
		<link rel="icon" type="image/svg+xml" href="/edgar/owl-icon.svg" />
		<link rel="apple-touch-icon" sizes="512x512" href="/favicon.png" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Tabula" />
		<meta property="og:title" content="Tabula · SQL lernen. Einfach ausprobieren." />
		<meta property="og:description" content="Kostenloser, quelloffener SQL-Trainer für den Informatikunterricht. Direkt im Browser, Server in Deutschland." />
		<meta property="og:locale" content="de_DE" />
		<meta property="og:url" content="https://www.tabulasql.de/" />
		<meta name="twitter:card" content="summary" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "Tabula",
				"url": "https://www.tabulasql.de/",
				"applicationCategory": "EducationalApplication",
				"operatingSystem": "Web",
				"inLanguage": "de-DE",
				"isAccessibleForFree": true,
				"license": "https://www.gnu.org/licenses/agpl-3.0.html",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
				"description": "SQL-Trainer für den Informatikunterricht ab Klasse 10. Abfragen laufen mit SQLite direkt im Browser.",
				"sameAs": ["https://github.com/WarumSindNamenSoSchwer/SbSQLTT"]
			}
		</script>
		<script>
			// Theme vor dem Rendern anwenden (kein Flash). Standard: hell.
			// Migration einmalig: alten Schlüssel 'sbsqltt-theme' auf 'tabula-theme' umziehen.
			try {
				const OLD = 'sbsqltt-theme';
				const NEW = 'tabula-theme';
				const old = localStorage.getItem(OLD);
				if (old !== null) {
					localStorage.setItem(NEW, old);
					localStorage.removeItem(OLD);
				}
				const saved = localStorage.getItem(NEW);
				if (saved === 'dark') {
					document.documentElement.classList.remove('light');
				} else {
					document.documentElement.classList.add('light');
				}
			} catch {
				document.documentElement.classList.add('light');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="font-sans antialiased text-ink-900">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
