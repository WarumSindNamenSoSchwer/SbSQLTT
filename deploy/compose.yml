services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    # Konsolenausgabe des Containers klein halten (Protokoll steht in /data/logs, siehe Caddyfile)
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
volumes:
  caddy_data:
  caddy_config:
