# deploy/compose.contact.yml
# Kontaktformular-Dienst. Auf dem Server in /opt/tabula zusammen mit compose.yml:
#   docker compose -f compose.yml -f compose.contact.yml up -d --build
#
# Kein Port nach außen; Caddy erreicht den Dienst über das gemeinsame Compose-Netz
# (tabula_default) unter contact:3001. Ausgehend braucht der Dienst nur SMTP (587).
# Secret-Datei /opt/tabula/secrets/smtp_formular muss UID 10001 gehören (chmod 400),
# da der Container nicht als root läuft.

services:
  contact:
    build:
      context: ./contact
      dockerfile: Dockerfile
    image: tabula-contact:latest
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      ALLOWED_ORIGIN: "https://www.tabulasql.de"
      LOG_LEVEL: "info"
    secrets:
      - smtp_formular
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

secrets:
  smtp_formular:
    file: /opt/tabula/secrets/smtp_formular
