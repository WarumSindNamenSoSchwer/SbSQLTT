# deploy/compose.backend.yml
# API-Dienst (Konten, Klassen, Fortschritt, Quiz). Auf dem Server in /opt/tabula:
#   docker compose -f compose.yml -f compose.contact.yml -f compose.backend.yml up -d --build api
#
# Kein Port nach außen. Caddy erreicht den Dienst im gemeinsamen Compose-Netz unter api:3000.
# Ausgehend braucht der Dienst nur SMTP (587) für Systemmails von noreply@.
# Secret /opt/tabula/secrets/smtp_noreply muss UID 10001 gehören (chmod 400).
# Erst starten, wenn die Freigabe-Checkliste in docs/BACKEND-DATENSCHUTZ.md erfüllt ist.

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: tabula-api:latest
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - api_data:/data
    environment:
      DB_PATH: /data/tabula.db
      PORT: "3000"
      HOST: "0.0.0.0"
      ALLOWED_ORIGIN: "https://app.tabulasql.de"
      SITE_URL: "https://app.tabulasql.de"
      LOG_LEVEL: "info"
    secrets:
      - smtp_noreply
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 384m
    logging:
      driver: local
      options:
        max-size: "1m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  api_data:

secrets:
  smtp_noreply:
    file: /opt/tabula/secrets/smtp_noreply
